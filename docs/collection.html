<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Collection — Pokémon Card Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <a href="index.html" class="back-link">&larr; Home</a>
    <h1>My Collection</h1>
  </header>

  <div id="grid" class="card-grid">
    <p class="loading-message">Loading...</p>
  </div>

  <script src="js/collection.js"></script>
  <script src="js/data.js"></script>
  <script src="js/grid.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById("grid");
      try {
        const collected = getCollection();

        if (collected.size === 0) {
          grid.innerHTML =
            "<p class='empty-message'>You haven't marked any cards yet. Check some off on the All Sets or Most Current Set page.</p>";
          return;
        }

        const manifest = await loadManifest();
        const all = await loadAllSets(manifest);
        const owned = all.filter((entry) => collected.has(entry.id));
        renderGrid(grid, owned);
      } catch (err) {
        grid.innerHTML = `<p class="empty-message">Couldn't load card data: ${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
